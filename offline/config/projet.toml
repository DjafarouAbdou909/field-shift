# Paramètres du projet. Chaque valeur tirée d'une source cite sa ligne exacte.

# Distance au-delà de laquelle l'application déclare un agriculteur hors zone. Choix de conception.
# 150 km depuis le 21 novembre 2026, comme le bot, pour couvrir tout le pays avec 33 villes.
rayon_couverture_km = 150

# Extractions AppEEARS désactivées le 14 novembre 2026. Les mêmes produits sur les mêmes
# points sont extraits par le dépôt de l'équipe, et un compte Earthdata ne traite ses
# tâches que les unes après les autres. Remettre à true pour les extraire ici.
appeears_actif = false

[periode]
debut = "2001-01-01"
fin = "2024-12-31"

# Chaque lieu est couvert par 3 x 3 points centrés sur les cases de 0,1 degré d'IMERG.
[grille]
pas = 0.1
rayon = 1

